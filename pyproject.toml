[project]
name = "instant-memory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Skinder OP", email = "skinder226@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "groq>=0.37.1",
    "httpx-aiohttp>=0.2.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.3.3",
    "langchain-groq>=1.1.3",
    "langchain-neo4j>=0.10.0",
    "langchain-openai>=1.4.3",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.2.10",
    "llmgraphtransformer>=0.0.2",
    "neo4j>=6.2.0",
    "openai>=2.53.0",
    "pinecone>=7.3.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.66.0",
    "pymongo[srv]>=4.17.0",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.160.0",
    "locust>=2.47.0",
    "pytest>=8.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
instant-memory = "instant_memory:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
